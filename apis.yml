aid: infutor
name: Infutor
description: >-
  InfutorData (part of ActiveProspect, formerly Infutor / Jornaya / LeadiD) is a
  consumer identity and data-solutions provider that helps marketers identify,
  understand, and reach consumers while maintaining privacy and compliance. Its
  platform delivers identity resolution and completion, identity scoring,
  consumer data enrichment and attributes, audience activation, and lead-quality
  and TCPA compliance tooling (TCPA Guardian, LeadiD tokens). Real-time query
  APIs on api.leadid.com support authentication, lead audit, intelligence, and
  privacy-guardian lookups, documented in the InfutorData help center. Backed by
  Norwest Venture Partners.
