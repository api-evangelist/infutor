  generated: '2026-08-13'
  method: searched
  note: >-
    Corrected from a prior derived guess of "self-serve signup". There is no
    signup, no pricing page and no self-serve key issuance for the LeadiD query
    APIs — the account code, audit profile key and authentication token are all
    issued by customersupport@infutor.com. Only the Activate API access token is
    self-service, and only once an account already exists.
