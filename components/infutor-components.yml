testing:
  - name: Create Implementation Testing (self-test)
    docs: https://help.infutor.com/docs/create-implementation-testing.md
    description: >-
      Verifies the campaign JavaScript is correctly implemented on a website or
      in a call center. See sandbox/infutor-sandbox.yml.
gaps:
  - >-
    No script URL, no Subresource Integrity hash and no version string is
    published — the snippet is generated per campaign inside the Member Portal,
    so a consumer cannot audit what code will execute on their form or pin it.
  - No npm/CDN distribution of any component. See packages/infutor-packages.yml.
