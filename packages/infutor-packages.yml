summary: >-
  InfutorData / LeadiD (part of ActiveProspect, formerly Infutor + Jornaya,
  formerly Verisk Marketing Solutions) publishes NO first-party client SDK on
  any public package registry. The documented integration path is a raw HTTPS
  GET against api.leadid.com plus an account-specific "Campaign Script"
  JavaScript snippet copied from the Member Portal (app.leadid.com) — neither is
  distributed as a versioned package. The only packages that wrap the LeadiD
  surface are community-published and all predate 2021.
